name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: Bundle — ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            os: ubuntu-24.04
          - id: linux-arm64
            os: ubuntu-24.04-arm
          - id: windows-x64
            os: windows-latest
          - id: windows-arm64
            os: windows-11-arm
          - id: macos-x64
            os: macos-13
          - id: macos-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm desktop:build
      - run: node scripts/check-release.mjs
      - run: node scripts/generate-release-manifest.mjs
        env:
          RELEASE_RUNNER: ${{ matrix.id }}
          RELEASE_MANIFEST_PATH: release-manifest/${{ matrix.id }}.json
      - run: node scripts/generate-sha256sums.mjs
        env:
          SHA256SUMS_PATH: release-manifest/${{ matrix.id }}-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TurkmenAI-Local-${{ matrix.id }}
          path: |
            target/release/bundle/**
            release-manifest/${{ matrix.id }}.json
            release-manifest/${{ matrix.id }}-SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: false
      - name: Create release with checksummed assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: find release-assets -type f -print0 | xargs -0 gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --generate-notes --title "TurkmenAI Local ${GITHUB_REF_NAME}"
