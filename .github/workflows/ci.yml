name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Core, API and website checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      - run: node scripts/check-i18n.mjs
      # One product: versions and download links must agree across repo, site
      # and the generated release manifest, and no link may point at a stale tag.
      - run: node scripts/check-consistency.mjs
      # Exclude the Tauri desktop shell: it needs GTK/webkit system libs that are
      # only installed in the `native` matrix below (which cargo-checks it per-OS).
      - run: cargo test --workspace --exclude turkmenai-desktop
      - run: cargo fmt --all -- --check

  native:
    name: Native check — ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            os: ubuntu-24.04
          - id: linux-arm64
            os: ubuntu-24.04-arm
          - id: windows-x64
            os: windows-latest
          - id: windows-arm64
            os: windows-11-arm
          # macos-x64 (macos-13 Intel) omitted: scarce hosted runners leave it
          # queued for hours. Apple Silicon covers the macOS cargo-check.
          - id: macos-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: cargo check -p turkmenai-desktop
