name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
        env:
          GITHUB_PAGES: 'true'
      - run: cp dist/public/index.html dist/public/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Post-deploy smoke test: the live site, its version string, the machine
      # -readable manifest, sitemap and robots must actually resolve. A broken
      # download link or a 404 fails the deploy instead of reaching users.
      - name: Verify the live site
        run: |
          set -euo pipefail
          base="https://turkmenai.tech"
          for pth in "/" "/api/releases/latest.json" "/sitemap.xml" "/robots.txt"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "$base$pth")
            echo "$pth -> $code"
            [ "$code" = "200" ] || { echo "FAIL: $base$pth returned $code"; exit 1; }
          done
          ver=$(curl -sL "$base/api/releases/latest.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')
          echo "live manifest version: $ver"
